services:
  bi_flask:
    build: ./flask-app
    container_name: bi_flask
    ports:
      - "5001:5000"
    volumes:
      - ./flask-app:/app
    env_file:
      - ./flask-app/.env
    networks:
      - erp-system_default
    depends_on:
      - bi_nginx

  bi_nginx:
    image: nginx:stable-alpine
    container_name: bi_nginx
    ports:
      - "5002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - erp-system_default

networks:
  erp-system_default:
    external: true
