# Rate limit per client IP. All ERP traffic arrives from the Laravel
# container, so keep the burst generous enough for normal page loads.
limit_req_zone $binary_remote_addr zone=bi_api:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Re-resolve the Flask container so a restart with a new IP does not
    # leave Nginx pointing at a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bi_upstream bi_flask:5000;

    location / {
        limit_req zone=bi_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://$bi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # gunicorn has a 120s timeout; stay just above it so Flask returns
        # the error instead of Nginx cutting the connection first.
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}
